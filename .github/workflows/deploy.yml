name: Deploy to Hugging Face Space and Streamlit Community Cloud

on:
  push:
    branches:
      - main # Déclenche le workflow à chaque push sur la branche 'main'

jobs:
  deploy-api-to-huggingface:
    runs-on: ubuntu-latest
    environment:
      name: huggingface # Environnement pour les secrets HF
    steps:
      - name: Checkout P8 repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Deploy FastAPI to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # Votre token Hugging Face (doit être configuré dans les secrets GitHub)
        run: |
          # Crée un répertoire temporaire qui sera le contenu de votre Space HF
          mkdir hf_space_content
          
          # Copie les fichiers de l'API (main.py, model_architecture.py, etc.)
          cp -r app/api/* hf_space_content/
          
          # Copie le fichier requirements.txt de l'API pour le Space
          cp app/api/requirements.txt hf_space_content/requirements.txt

          # Copie le modèle et sa structure de répertoires comme attendu par main.py
          # Assurez-vous que le chemin ici correspond à l'emplacement réel de votre modèle
          mkdir -p hf_space_content/app/model/DeepLabV3_ResNet_WithAug/
          cp app/model/DeepLabV3_ResNet_WithAug/final_model.keras hf_space_content/app/model/DeepLabV3_ResNet_WithAug/

          # Crée un fichier .gitignore pour le Space
          echo "__pycache__" > hf_space_content/.gitignore
          echo "*.pyc" >> hf_space_content/.gitignore
          echo ".venv" >> hf_space_content/.gitignore
          echo "venv" >> hf_space_content/.gitignore
          echo "models/" >> hf_space_content/.gitignore # Si vous ne voulez pas que les modèles soient versionnés dans le Space

          # Crée un README.md pour le Hugging Face Space
          # Ce fichier indique à Hugging Face comment exécuter votre application FastAPI
          cat <<EOF > hf_space_content/README.md
          ---
          title: P8 FastAPI Segmentation API
          emoji: 🚀
          colorFrom: blue
          colorTo: purple
          sdk: python
          python_version: "3.10" # Assurez-vous que cette version correspond à celle utilisée par votre API
          app_file: main.py # Le point d'entrée de votre application FastAPI
          app_port: 8000
          ---

          # P8 FastAPI Segmentation API

          Ce Space héberge l'application FastAPI pour la segmentation sémantique.
          L'API est accessible via l'URL du Space.

          ## Utilisation
          Envoyez une requête POST à l'endpoint /predict ou /predict_image.
          EOF

          # Initialise un dépôt Git dans le répertoire temporaire
          cd hf_space_content
          git init
          git branch -m main
          
          # Configuration Git LFS (obligatoire pour votre modèle de 400 Mo)
          git lfs install
          git lfs track "*.keras"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git commit -m "Deploy FastAPI app to Hugging Face Space with LFS"

          # Authentification via le token dans l'URL
          # IMPORTANT : Remplacez <YOUR_HF_USERNAME> et <YOUR_SPACE_NAME> par vos vrais identifiants
          git remote add origin "https://kamelbest:${HF_TOKEN}@huggingface.co/spaces/S0l0kame/OpenClassroomP8"
          
          # Pousse les fichiers (LFS gèrera automatiquement le transfert du .keras)
          git push --force origin main
          cd ..

  deploy-ui-to-streamlit-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P8 repository
        uses: actions/checkout@v3

      - name: Notify Streamlit Community Cloud (Informational)
        run: |
          echo "Push sur la branche 'main' détecté. Streamlit Community Cloud va automatiquement redéployer si configuré."
          echo "Assurez-vous que votre application Streamlit sur Streamlit Community Cloud est liée à ce dépôt GitHub (branche 'main')."
          echo "Vérifiez également que le 'Main file path' est défini sur 'app/ui/app.py' et le 'Requirements file path' sur 'app/ui/requirements.txt' dans les paramètres de votre application Streamlit Cloud."
          # Aucune action de déploiement directe n'est nécessaire ici, car Streamlit Cloud gère cela automatiquement.
          # Si vous aviez un token d'API Streamlit Cloud et souhaitiez déclencher un déploiement spécifique,
          # vous utiliseriez 'curl' ou une action dédiée ici.